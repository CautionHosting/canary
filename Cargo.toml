[workspace]
resolver = "2"
members = ["crates/canary-core", "crates/canaryd", "crates/canaryctl"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.88"

[workspace.dependencies]
# Internal
canary-core = { path = "crates/canary-core" }

# Bootproof verifier (commit-pinned; verifier-only default feature)
bootproof-sdk = { git = "https://git.distrust.co/public/bootproof", rev = "78f531a2c245404a9d8879fb71cc397096ae0077", version = "0.1.0" }

# Crypto
ed25519-dalek = { version = "2", features = ["rand_core"] }
fips204 = "0.4"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }

# Serialization / canonicalization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_jcs = "0.1"
serde_cbor = "0.11"
base64 = "0.22"
hex = "0.4"

# CLI / HTTP (canaryctl)
clap = { version = "4", features = ["derive"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

# Errors / misc
thiserror = "2"
anyhow = "1"
url = "2"
chrono = { version = "0.4", features = ["serde"] }

# Phase 2 async service / network / storage
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal", "fs", "test-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono", "json"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# HTTP test support
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
