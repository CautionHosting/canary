[workspace]
resolver = "2"
members = ["crates/canary-core", "crates/canaryd", "crates/canaryctl"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
# Internal
canary-core = { path = "crates/canary-core" }

# Bootproof verifier (git-pinned, house convention; verifier-only default feature)
bootproof-sdk = { git = "https://git.distrust.co/public/bootproof", version = "0.1.0" }

# Crypto
ed25519-dalek = { version = "2", features = ["rand_core"] }
fips204 = "0.4"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }

# Serialization / canonicalization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_jcs = "0.1"
serde_cbor = "0.11"
base64 = "0.22"
hex = "0.4"

# CLI / HTTP (canaryctl)
clap = { version = "4", features = ["derive"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

# Errors / misc
thiserror = "2"
anyhow = "1"
url = "2"
chrono = { version = "0.4", features = ["serde"] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
